<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Built</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0a0b0f;
      --surface: #13151c;
      --border:  #1e2130;
      --teal:    #5dcaa5;
      --white:   #f0f2f5;
      --muted:   #6b7280;
    }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Geist', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }

    /* ── Header ── */
    header {
      padding: 2rem 1.5rem;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }
    .wordmark { font-size: 1.1rem; letter-spacing: 0.12em; }
    .wordmark span:first-child { font-weight: 600; color: var(--teal); }
    .wordmark span:last-child  { font-weight: 300; color: var(--white); }

    /* ── Hero ── */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem 1.5rem 3rem;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }
    .hero h1 {
      font-size: clamp(2.2rem, 6vw, 3.6rem);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    .hero p {
      font-size: 1.05rem;
      font-weight: 300;
      color: var(--muted);
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background: var(--teal);
      color: #0a0b0f;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      transition: opacity 0.15s;
      align-self: flex-start;
    }
    .btn:hover { opacity: 0.85; }

    /* ── Product card ── */
    .card {
      max-width: 900px;
      margin: 0 auto 4rem;
      width: 100%;
      padding: 0 1.5rem;
    }
    .card-inner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .card-inner h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; }
    .card-inner p  { font-size: 0.85rem; font-weight: 300; color: var(--muted); }
    .card-link { font-size: 0.85rem; font-weight: 600; color: var(--teal); white-space: nowrap; }
    .card-link:hover { opacity: 0.8; }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }
    .footer-copy { font-size: 0.8rem; color: var(--muted); }
    .footer-links { display: flex; gap: 1.25rem; }
    .footer-links a { font-size: 0.8rem; color: var(--muted); transition: color 0.15s; }
    .footer-links a:hover { color: var(--white); }
  </style>
</head>
<body>

  <header>
    <div class="wordmark"><span>PULSE</span> <span>BUILT</span></div>
  </header>

  <main class="hero">
    <h1>Your data,<br>finally useful.</h1>
    <p>We build tools that turn fragmented fitness data into clear, actionable insight.</p>
    <a class="btn" href="https://engine.pulsebuilt.net">Launch PulseEngine →</a>
  </main>

  <div class="card">
    <div class="card-inner">
      <div>
        <h2>PulseEngine</h2>
        <p>Unified training and recovery dashboard for Garmin + Whoop athletes.</p>
      </div>
      <a class="card-link" href="https://engine.pulsebuilt.net">Open App →</a>
    </div>
  </div>

  <footer>
    <span class="footer-copy">© 2026 Pulse Built</span>
    <nav class="footer-links">
      <a href="#">Instagram</a>
      <a href="#">TikTok</a>
      <a href="#">LinkedIn</a>
      <a href="https://engine.pulsebuilt.net/privacy">Privacy Policy</a>
    </nav>
  </footer>

</body>
</html>
